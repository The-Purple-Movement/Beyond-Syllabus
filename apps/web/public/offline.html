<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Beyond Syllabus</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, sans-serif;
        background: #030013;
        color: #e5e7eb;
        text-align: center;
        padding: 24px;
      }
      .card { max-width: 420px; }
      h1 { font-size: 1.4rem; margin-bottom: 0.5rem; color: #a78bfa; }
      p { line-height: 1.6; color: #9ca3af; font-size: 0.95rem; }
      a { color: #a78bfa; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>
        No connection right now, and this page isn't cached yet. Pages and
        syllabi you've already visited still work: try
        <a href="/journey">your journey</a>, or head back once you're
        connected.
      </p>
      <p>Your question sheets and progress are safe on this device.</p>
    </div>
  </body>
</html>
