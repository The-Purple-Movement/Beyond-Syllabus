name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (oxlint)
        run: bun run check

      - name: Type check
        run: bun run check-types

      - name: Tests (vitest)
        run: bun run test
        env:
          # Most of our students live at UTC+05:30. Running tests in that
          # timezone is what lets the local-vs-UTC date regressions
          # (ISSUE-005) actually fail on UTC runners.
          TZ: Asia/Kolkata

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
          # Build must succeed without real secrets; AI client fails lazily
          # at first use, not at build time.
          UPSTASH_REDIS_URL: https://placeholder.upstash.io
          UPSTASH_REDIS_TOKEN: placeholder
